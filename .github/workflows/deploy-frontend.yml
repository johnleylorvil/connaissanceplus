name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_ENABLE_GOOGLE_AUTH: ${{ vars.VITE_ENABLE_GOOGLE_AUTH }}
      VITE_PUBLIC_APP_ORIGIN: ${{ vars.VITE_PUBLIC_APP_ORIGIN }}
      VITE_ADMIN_APP_ORIGIN: ${{ vars.VITE_ADMIN_APP_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload versioned assets to S3
        # Keep older hashed assets available to tabs running an earlier release.
        run: aws s3 sync ./dist/assets "s3://${{ vars.FRONTEND_S3_BUCKET }}/assets" --cache-control "public,max-age=31536000,immutable"

      - name: Upload public files to S3
        run: aws s3 sync ./dist "s3://${{ vars.FRONTEND_S3_BUCKET }}" --exclude "assets/*" --exclude "index.html" --cache-control "no-cache"

      - name: Publish HTML without browser caching
        # Publish last so its JS/CSS references are already available. CloudFront
        # invalidation alone does not clear cached HTML in visitors' browsers.
        run: aws s3 cp ./dist/index.html "s3://${{ vars.FRONTEND_S3_BUCKET }}/index.html" --content-type "text/html; charset=utf-8" --cache-control "no-store,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          invalidation_id=$(aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --id "$invalidation_id"
